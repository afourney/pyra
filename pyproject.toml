[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyra"
version = "0.2.6"
description = "A Python implementation of the GCL region algebra and query language described by Clarke et al."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "Adam Fourney"}]
dependencies = ["ply==3.11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/afourney/pyra"

[tool.setuptools]
packages = ["pyra"]

[tool.setuptools.package-data]
pyra = ["py.typed"]

[dependency-groups]
dev = [
    "ruff",
    "poethepoet",
    "codespell",
    "pyright>=1.1.414",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["parsetab.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "ANN", # required function annotations
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # docstrings
    "SIM", # flake8-simplify
    "BLE", # flake8-blind-except
    "ISC", # implicit string concatenation
    "RUF", # ruff's own
]
ignore = [
    "E501",  # line too long; the formatter decides
    "UP017", # datetime.UTC alias
    "D203",  # conflicts with D211 (no blank line before class)
    "D213",  # conflicts with D212 (summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["D", "ANN"]
# PLY reads these docstrings as regular expressions and grammar productions.
"pyra/gcl_lex.py" = ["D400", "D403", "D415"]
"pyra/gcl_yacc.py" = ["D400", "D403", "D415"]

[tool.poe.executor]
type = "uv"
# Preserve the environment prepared by uv sync (including non-editable CI installs).
no-sync = true

[tool.poe.tasks]
format = "ruff format --check --diff pyra test examples typings"
format-fix = "ruff format pyra test examples typings"
lint = "ruff check pyra test examples typings"
lint-fix = "ruff check --fix pyra test examples typings"
# Check source and documentation, excluding the test fixtures and Shakespeare corpus.
spell = "codespell pyra examples/gcl_shell.py README.md"
test = "python -I -m unittest discover -s test -v"
typecheck = "pyright"
check = ["format", "lint", "spell", "typecheck"]
check-all = ["format", "lint", "spell", "typecheck", "test"]
fix-all = ["format-fix", "lint-fix"]

[tool.pyright]
include = ["pyra", "examples/gcl_shell.py", "typings"]
stubPath = "typings"
exclude = ["test", "**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
